<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Nexus</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            background-color: black;
            color: white;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900; /* Thicker font weight */
            
            /* Black to strong purple text gradient */
            background: linear-gradient(180deg, #1a001a 0%, #a000f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            margin-bottom: 15px;
        }

        p {
            margin-bottom: 10px;
        }

        a {
            color: #b15eff;
        }

        /* Anchored footer */
        .footer-container {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 5px;
            align-items: center;
            justify-content: center;
        }

        .footer-container p {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <h1>Project Nexus</h1>
    <p>Attempting to ressurect a deceased fly by extracting its brain and placing it into a Unity game.</p>
    <p><b>Project Nexus is now in effect, and the trials have begun.</b> This page will live update with each discovery.</p>
    <p>Last Updated: 9-15-2026</p>
    
    <div class="footer-container">
        <p class="footer">Overseen by Josh Clark - </p>
        <a href="https://wsgpolar.me">https://wsgpolar.me</a>
    </div>
</body>
</html>
